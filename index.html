<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        /* Stili per il pannello di controllo delle singole feature */
        .pannello-features {
            position: absolute; 
            top: 10px; 
            right: 10px; 
            z-index: 1000; 
            background: white; 
            padding: 15px; 
            border-radius: 5px; 
            max-height: calc(100% - 40px); 
            overflow-y: auto; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            width: 280px; 
            font-family: 'Open Sans', sans-serif; 
            font-size: 13px;
            color: #333;
        }
        .pannello-features h4 {
            margin-top: 0; 
            margin-bottom: 12px; 
            border-bottom: 2px solid #0066cc; 
            padding-bottom: 5px;
            font-size: 14px;
        }
        .pannello-features h5 {
            margin-top: 10px;
            margin-bottom: 6px;
            color: #555;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sezione-lista {
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 5px;
            background: #fafafa;
        }
        .riga-checkbox {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
        }
        .riga-checkbox input {
            margin-right: 6px;
            margin-top: 2px;
            cursor: pointer;
        }
        .riga-checkbox label {
            cursor: pointer;
            line-height: 1.3;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <div class="pannello-features">
            <h4>Filtro Elementi</h4>
            
            <h5>Siti Guida</h5>
            <div id="lista-checkbox-siti" class="sezione-lista">Caricamento siti...</div>

            <h5>Musei Guida</h5>
            <div id="lista-checkbox-musei" class="sezione-lista">Caricamento musei...</div>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/regioni_1.js"></script><script src="layers/unitaterritorialisovracomunali_2.js"></script><script src="layers/museiguidavol2_4.js"></script><script src="layers/sitiguidavol2_5.js"></script>
        <script src="styles/regioni_1_style.js"></script><script src="styles/unitaterritorialisovracomunali_2_style.js"></script><script src="styles/comuni_3_style.js"></script><script src="styles/museiguidavol2_4_style.js"></script><script src="styles/sitiguidavol2_5_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>        

        <script>
        (function() {
            var sitiNascosti = [];
            var museiNascosti = [];
            var tutteLeFeaturesSiti = [];
            var tutteLeFeaturesMusei = [];

            function inizializzaFiltri() {
                // Estrariamo e leggiamo in memoria le feature originarie dei Siti
                if (typeof format_sitiguidavol2_5 !== 'undefined' && typeof json_sitiguidavol2_5 !== 'undefined') {
                    tutteLeFeaturesSiti = format_sitiguidavol2_5.readFeatures(json_sitiguidavol2_5, {
                        dataProjection: 'EPSG:4326', 
                        featureProjection: 'EPSG:3857'
                    });
                }
                
                // Estrariamo e leggiamo in memoria le feature originarie dei Musei
                if (typeof format_museiguidavol2_4 !== 'undefined' && typeof json_museiguidavol2_4 !== 'undefined') {
                    tutteLeFeaturesMusei = format_museiguidavol2_4.readFeatures(json_museiguidavol2_4, {
                        dataProjection: 'EPSG:4326', 
                        featureProjection: 'EPSG:3857'
                    });
                }

                generaLista('Sito/Museo', tutteLeFeaturesSiti, 'lista-checkbox-siti', sitiNascosti, jsonSource_sitiguidavol2_5);
                generaLista('Museo', tutteLeFeaturesMusei, 'lista-checkbox-musei', museiNascosti, jsonSource_museiguidavol2_4);
            }

            function generaLista(campoNome, elencoFeatures, idContenitore, arrayNascosti, sorgenteOL) {
                var container = document.getElementById(idContenitore);
                if (!container || elencoFeatures.length === 0) {
                    if (container) container.innerHTML = '<em style="color:#999;">Nessun dato trovato</em>';
                    return;
                }
                container.innerHTML = '';

                // Recuperiamo i nomi unici dei punti, filtrando i null ed ordinandoli alfabeticamente
                var nomiUnici = elencoFeatures.map(function(f) {
                    return f.get(campoNome);
                }).filter(function(value, index, self) {
                    return value && self.indexOf(value) === index;
                }).sort();

                nomiUnici.forEach(function(nome, idx) {
                    var riga = document.createElement('div');
                    riga.className = 'riga-checkbox';

                    var chk = document.createElement('input');
                    chk.type = 'checkbox';
                    chk.id = idContenitore + '-' + idx;
                    chk.checked = true;

                    chk.addEventListener('change', function() {
                        if (!this.checked) {
                            if (arrayNascosti.indexOf(nome) === -1) arrayNascosti.push(nome);
                        } else {
                            var index = arrayNascosti.indexOf(nome);
                            if (index > -1) arrayNascosti.splice(index, 1);
                        }

                        // Applichiamo il filtro sulla sorgente del layer
                        var attive = elencoFeatures.filter(function(feature) {
                            return arrayNascosti.indexOf(feature.get(campoNome)) === -1;
                        });

                        if (sorgenteOL) {
                            sorgenteOL.clear();
                            sorgenteOL.addFeatures(attive);
                        }
                    });

                    var lbl = document.createElement('label');
                    lbl.htmlFor = chk.id;
                    lbl.appendChild(document.createTextNode(nome));

                    riga.appendChild(chk);
                    riga.appendChild(lbl);
                    container.appendChild(riga);
                });
            }

            // Avvio sincronizzato col caricamento della pagina e delle librerie QGIS2web
            window.addEventListener('DOMContentLoaded', function() {
                setTimeout(inizializzaFiltri, 600);
            });
        })();
        </script>
    </body>
</html>
